worker_processes auto;
error_log /dev/stdout;
pid /dev/shm/nginx.pid;

env TZ=GMT;
env LC_ALL=C.UTF-8;
env LANG=en_US.UTF-8;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;
load_module modules/ngx_http_perl_module.so;

include /usr/lib/nginx/modules/*.conf;
events {
    worker_connections 64;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log   /dev/stdout;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    default_type  application/json;

    upstream llama_backend {
        server unix:/tmp/llama.sock;
    }

    perl_modules /app/lib/perl;
    perl_modules /usr/lib/perl5/vendor_perl/x86_64-linux-thread-multi/;
    perl_require llama.pm;

    server {
        listen [::]:8000;
        server_name _;
        root /site/;
        sendfile                  on;
        gzip                      on;
        gzip_proxied              no-cache no-store private expired auth;
        tcp_nodelay               on;
        client_max_body_size      8m;
        client_body_timeout       10s;
        send_timeout              10s;
        ignore_invalid_headers    off;

        resolver 127.0.0.11 ipv6=off valid=3s;

        location /fixup {
            internal;
            perl llama::fixup;
        }

        # Cache API — routes to Llama::Cache instead of llama-server
        location /api/cache/health {
            perl llama::cache_health;
        }

        location /api/cache/v1/health {
            perl llama::cache_health;
        }

        location /api/cache/v1/models {
            perl llama::cache_models;
        }

        location /api/cache/v1/slots {
            perl llama::cache_slots;
        }

        location /api/cache/v1/chat/completions {
            perl llama::cache_chat;
        }

        location /api/cache/v1/completions {
            perl llama::cache_completion;
        }

        location /api/cache/v1/embeddings {
            perl llama::cache_embeddings;
        }

        location /api/cache {
            perl llama::cache_chat;
        }

        location / {
            # "access_by_lua" is run FIRST
            # but we just capture -> rewrite before sending off to the proxy
            access_by_lua_block {
              if ngx.req.get_method() == "POST" then
                -- 1. Read request body into memory
                ngx.req.read_body()
                local req_body = ngx.req.get_body_data()

                -- 2. Pass body to internal Perl subrequest
                local r = ngx.location.capture("/fixup", {
                    method = ngx.HTTP_POST,
                    body = req_body,
                    always_forward_body = true
                })

                -- 3. Check subrequest execution & set updated body
                if r.status == ngx.HTTP_OK and r.body then
                    ngx.req.set_body_data(r.body)
                    ngx.req.set_header("Content-Length", string.len(r.body))
                end
              end
            }

            proxy_connect_timeout 3s;
            proxy_send_timeout    10s;
            proxy_read_timeout    900s;
            proxy_pass http://llama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
