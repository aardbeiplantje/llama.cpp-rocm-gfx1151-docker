worker_processes auto;
error_log /dev/stdout;
pid /dev/shm/nginx.pid;

env TZ=GMT;
env LC_ALL=C.UTF-8;
env LANG=en_US.UTF-8;
env MODEL;
env MODEL_PATH;
env MODELS_DIR;
env HF_HOME;
env HF_TOKEN;
env HF_HUB_CACHE;
env LLAMA_PRESETS;
env LLAMA_DOCKER_IMAGE;
env XDG_CACHE_HOME;
env LD_LIBRARY_PATH;
env HSA_OVERRIDE_GFX_VERSION;
env GGML_CUDA_ENABLE_UNIFIED_MEMORY;
env GGML_HIP_FORCE_RS_GPU;
env GGML_HIP_FORCE_KV_GPU;
env GGML_HIP_ALLOC_GRAPH_RESERVE;
env HSA_FORCE_FINE_GRAIN_PCIE;
env HSA_ENABLE_SDMA;
env PRESET_FILE;
env MODELS;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;
load_module modules/ngx_http_perl_module.so;

include /usr/lib/nginx/modules/*.conf;
events {
    worker_connections 64;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log   /dev/stdout;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    default_type  application/json;

    upstream llama_backend {
        server unix:/tmp/llama.sock;
    }

    # rocm-inference-server (ROCm::Inference, https://github.com/CowboyTim/rocm-hip): one model, served at
    # /rocm/v1/... (llama.sh: ROCM_MODEL=... with server, or the rocm-server subcommand)
    upstream rocm_backend {
        server unix:/tmp/rocm-inference.sock;
    }

    perl_modules /app/lib/perl;
    perl_modules /usr/lib/perl5/vendor_perl/x86_64-linux-thread-multi/;
    perl_require llama.pm;

    server {
        listen [::]:8000;
        server_name _;
        root /site/;
        sendfile                  on;
        gzip                      on;
        gzip_proxied              no-cache no-store private expired auth;
        tcp_nodelay               on;
        client_max_body_size      8m;
        client_body_timeout       10s;
        send_timeout              10s;
        ignore_invalid_headers    off;

        resolver 127.0.0.11 ipv6=off valid=3s;

        location /fixup {
            internal;
            perl llama::fixup;
        }

        location / {
            access_by_lua_file /app/lib/lua/fixup.lua;

            proxy_connect_timeout 3s;
            proxy_send_timeout    10s;
            proxy_read_timeout    900s;
            proxy_pass http://llama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rocm/ {
            # the same request fixups, then ROCm::Inference: /rocm/v1/chat/completions -> /v1/chat/completions
            access_by_lua_file /app/lib/lua/fixup.lua;

            proxy_connect_timeout 3s;
            proxy_send_timeout    10s;
            proxy_read_timeout    900s;
            proxy_http_version    1.1;
            proxy_buffering       off;  # server-sent events as they come
            proxy_pass http://rocm_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
